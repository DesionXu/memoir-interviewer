<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回忆录访谈员 · 把一生的故事讲给后人听</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(160deg, #faf3e7 0%, #f2e6d3 45%, #e9d9c0 100%);
            color: #4a3a2c;
            padding: 48px 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* 柔和光斑装饰 */
        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            pointer-events: none;
            animation: drift 16s ease-in-out infinite alternate;
        }
        .glow.g1 { width: 430px; height: 430px; background: #f5d9b0; top: -130px; left: -110px; }
        .glow.g2 { width: 390px; height: 390px; background: #d9c6e8; bottom: -150px; right: -90px; animation-delay: -8s; }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(46px, 34px) scale(1.08); }
        }

        .hero {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: rise 1s ease both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(26px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 中央徽标 */
        .emblem {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 54px;
            box-shadow: 0 12px 32px rgba(122, 94, 58, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.85);
            animation: float 5.5s ease-in-out infinite;
            margin-bottom: 30px;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }

        h1 {
            font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
            font-size: clamp(46px, 9vw, 76px);
            font-weight: 700;
            letter-spacing: 10px;
            color: #43332a;
            margin-bottom: 20px;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
        }
        .tagline {
            font-family: "Noto Serif SC", "Songti SC", serif;
            font-size: clamp(17px, 3.4vw, 23px);
            color: #8a7660;
            letter-spacing: 4px;
            margin-bottom: 58px;
        }

        /* 中间的回忆录大按钮 */
        .btn-memoir {
            display: inline-block;
            text-decoration: none;
            font-size: 26px;
            letter-spacing: 8px;
            color: #fff;
            background: linear-gradient(135deg, #9a8876 0%, #7c6a58 100%);
            padding: 24px 78px;
            border-radius: 999px;
            box-shadow: 0 16px 40px rgba(122, 94, 58, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: rise 1s 0.25s ease both;
        }
        .btn-memoir:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 52px rgba(122, 94, 58, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
        .btn-memoir:active { transform: translateY(0); }

        /* 功能标签 */
        .features {
            margin-top: 66px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .feature {
            font-size: 17px;
            color: #6d5a46;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 14px 28px;
            border-radius: 999px;
            letter-spacing: 2px;
            box-shadow: 0 6px 18px rgba(122, 94, 58, 0.10);
            animation: rise 1s 0.4s ease both;
        }

        footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            color: #a08c74;
            letter-spacing: 1px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <main class="hero">
        <div class="emblem">📖</div>
        <h1>回忆录访谈员</h1>
        <p class="tagline">把一生的故事，慢慢讲给后人听</p>
        <a class="btn-memoir" href="memoir.html">📜 开启回忆录</a>
        <div class="features">
            <span class="feature">🎤 开口即聊</span>
            <span class="feature">🔊 温柔朗读</span>
            <span class="feature">🎙️ 方言陪伴</span>
        </div>
    </main>

    <footer>为长辈设计的 AI 陪伴访谈 · 免费开源</footer>
</body>
</html>
